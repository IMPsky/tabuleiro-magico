name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar ajudante de erros
        run: |
          cat > "$RUNNER_TEMP/run.sh" <<'SH'
          set -o pipefail
          "$@" 2>&1 | tee "$RUNNER_TEMP/out.log"; s=${PIPESTATUS[0]}
          if [ "$s" -ne 0 ]; then
            msg=$(grep -E "error|Error|ERROR|wrong|FAIL|\.java:" "$RUNNER_TEMP/out.log" | tail -25; echo ----; tail -25 "$RUNNER_TEMP/out.log")
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
            echo "::error title=Falha em: $*::$msg"
          fi
          exit $s
          SH
          chmod +x "$RUNNER_TEMP/run.sh"
      - run: $RUNNER_TEMP/run.sh npm install
      - run: $RUNNER_TEMP/run.sh npx cap sync android
      - name: Compilar APK
        run: |
          cd android && chmod +x gradlew
          $RUNNER_TEMP/run.sh ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../TabuleiroMagico.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TabuleiroMagico-apk
          path: TabuleiroMagico.apk
      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tabuleiro Mágico (build ${{ github.run_number }})
          files: TabuleiroMagico.apk
